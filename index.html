<!doctype html>
<html lang="ko">
<head><script src="/__baze/bridge.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>책갈피 — 도서 가격·중고·지역 도서관 통합 탐색</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #ffffff;
      --border: #e7e5e4;
      --border-strong: #d6d3d1;
      --text: #18181b;
      --muted: #52525b;
      --subtle: #a1a1aa;
      --pine: #1b4332;
      --pine-hover: #143326;
      --pine-soft: #ecfdf5;
      --amber: #92400e;
      --amber-soft: #fffbeb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      word-break: keep-all;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .container { max-width: 1152px; margin: 0 auto; padding: 0 20px; }
    .header-inner { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--pine); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .brand-title { font-size: 18px; font-weight: 700; margin: 0; }
    .brand-sub { font-size: 12px; color: var(--muted); margin: 0; }
    main { padding: 28px 0 48px; display: flex; flex-direction: column; gap: 24px; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
    }
    .intro-card { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
    .intro-title { font-size: 20px; font-weight: 700; margin: 0 0 6px; }
    .intro-desc { font-size: 14px; color: var(--muted); margin: 0; max-width: 680px; }
    .stat-box { border-left: 1px solid var(--border); padding-left: 24px; text-align: right; }
    .stat-label { font-size: 12px; color: var(--muted); }
    .stat-num { font-size: 36px; font-weight: 800; color: var(--pine); font-variant-numeric: tabular-nums; }
    .stat-unit { font-size: 16px; font-weight: 700; color: #3f3f46; margin-left: 4px; }
    .search-grid { display: grid; grid-template-columns: 6fr 4fr 2fr; gap: 12px; align-items: end; }
    .field-label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%; height: 42px; padding: 0 12px;
      border: 1px solid var(--border-strong); border-radius: 12px;
      font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
    }
    input:focus, select:focus { outline: 2px solid var(--pine); outline-offset: -1px; }
    .btn-primary {
      width: 100%; height: 42px; border: 0; border-radius: 12px;
      background: var(--pine); color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .btn-primary:hover { background: var(--pine-hover); }
    .history-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: #f5f5f4; border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 10px;
    }
    .chip button { border: 0; background: none; cursor: pointer; font-family: inherit; font-size: 12px; padding: 0; color: inherit; }
    .top-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: stretch; }
    .book-card { display: flex; gap: 24px; height: 480px; }
    .cover-wrap { height: 100%; flex-shrink: 0; display: flex; align-items: center; }
    .cover-img { height: 100%; max-width: 280px; object-fit: contain; border-radius: 12px; border: 1px solid var(--border); background: #fafaf9; }
    .cover-placeholder {
      width: 220px; height: 100%; border-radius: 12px; border: 1px solid var(--border);
      background: #f5f5f4; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 16px; font-weight: 700; color: var(--pine); font-size: 18px;
    }
    .book-meta { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
    .isbn-badge { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #f5f5f4; color: var(--muted); font-family: monospace; }
    .book-title { font-size: 24px; font-weight: 700; margin: 8px 0 4px; }
    .book-sub { font-size: 14px; color: var(--muted); margin: 0; }
    .lib-card { display: flex; flex-direction: column; gap: 12px; height: 480px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #f5f5f4; }
    .card-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
    .region-row { display: flex; gap: 8px; }
    .region-row select { height: 36px; font-size: 12px; border-radius: 8px; }
    .lib-filter { height: 36px; font-size: 12px; border-radius: 8px; }
    .lib-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
    .item-link {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .item-link:hover { border-color: var(--pine); background: #fafaf9; }
    .lib-item { display: block; }
    .item-title { font-size: 14px; font-weight: 600; }
    .item-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tag-pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--pine-soft); color: var(--pine); font-weight: 500; }
    .bottom-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    .stores-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .channel-label { font-size: 11px; font-weight: 600; color: var(--amber); margin-bottom: 2px; }
    .price-col { text-align: right; flex-shrink: 0; }
    .price-orig { font-size: 12px; color: var(--subtle); text-decoration: line-through; }
    .price-sale { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    @media (max-width: 960px) {
      .search-grid, .top-grid, .bottom-grid, .stores-grid { grid-template-columns: 1fr; }
      .book-card, .lib-card { height: auto; flex-direction: column; }
      .cover-img { height: 260px; }
      .stat-box { border-left: 0; padding-left: 0; text-align: left; border-top: 1px solid var(--border); padding-top: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-icon">책</div>
        <div>
          <h1 class="brand-title">책갈피</h1>
          <p class="brand-sub">신간 · 중고 도서 &amp; 지역 도서관 도서 페이지 바로가기</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card intro-card">
      <div>
        <h2 class="intro-title">사서 볼지, 빌려 볼지 한눈에 비교하는 도서 길잡이</h2>
        <p class="intro-desc">
          책갈피는 도서명과 작가명 한 번의 검색으로 교보문고·알라딘·예스24·영풍문고의 신간 페이지,
          중고 도서 매물 페이지, 그리고 내 주변 지역 도서관의 도서 검색 페이지까지 바로 연결해 드려요.
        </p>
      </div>
      <div class="stat-box">
        <div class="stat-label">연동된 대한민국 지역 설립 도서관</div>
        <div><span class="stat-num">1,643</span><span class="stat-unit">개관</span></div>
      </div>
    </section>

    <section class="card">
      <form id="search-form">
        <div class="search-grid">
          <div>
            <label class="field-label" for="title-input">도서명 또는 ISBN *</label>
            <input id="title-input" value="채식주의자" placeholder="예: 채식주의자" />
          </div>
          <div>
            <label class="field-label" for="author-input">작가명 (선택)</label>
            <input id="author-input" value="한강" placeholder="예: 한강" />
          </div>
          <div>
            <button type="submit" class="btn-primary">검색하기</button>
          </div>
        </div>
        <div id="history-row" class="history-row" style="display:none;"></div>
      </form>
    </section>

    <div class="top-grid">
      <section class="card book-card" id="book-card"></section>

      <section class="card lib-card">
        <div class="card-head">
          <h3>지역 도서관</h3>
          <span class="tag-pill" id="lib-count">0곳</span>
        </div>
        <div class="region-row">
          <select id="sido-select" aria-label="시도 선택"></select>
          <select id="unit-select" aria-label="시군구 선택"></select>
        </div>
        <input id="lib-filter" class="lib-filter" placeholder="도서관명 또는 동 검색..." />
        <div id="lib-list" class="lib-list"></div>
      </section>
    </div>

    <div class="bottom-grid">
      <div class="stores-grid">
        <section class="card">
          <div class="card-head"><h3>신간 구매사이트</h3><span style="font-size:12px;color:#71717a;">클릭 시 이동</span></div>
          <div id="new-stores" style="display:flex;flex-direction:column;gap:10px;margin-top:14px;"></div>
        </section>
        <section class="card">
          <div class="card-head"><h3>중고 도서 사이트</h3><span style="font-size:12px;color:#71717a;">클릭 시 이동</span></div>
          <div id="used-stores" style="display:flex;flex-direction:column;gap:10px;margin-top:14px;"></div>
        </section>
      </div>
    </div>
  </main>

        if (host === "mplib.mapo.go.kr") return { url: `https://mplib.mapo.go.kr/mcl/PGM3007/plusSearchResultList.do?searchType=SIMPLE&searchKeyword=${q}`, direct: true };
        if (host === "lib.sdm.or.kr") return { url: `https://lib.sdm.or.kr/sdmlib/menu/10003/program/30001/searchResultList.do?searchType=SIMPLE&searchKeyword=${q}&searchManageCode=ALL`, direct: true };
        if (host === "www.snlib.go.kr") return { url: `https://www.snlib.go.kr/intro/menu/10035/program/30009/plusSearchResultList.do?searchType=SIMPLE&searchCategory=BOOK&searchKey=TITLE&searchKeyword=${q}&searchPbLibrary=ALL&searchLibraryArr=MA&searchLibraryArr=MD&searchLibraryArr=MG&searchLibraryArr=BF&searchLibraryArr=MM&searchLibraryArr=MW&searchLibraryArr=MB&searchLibraryArr=MV&searchLibraryArr=MO&searchLibraryArr=MS&searchLibraryArr=MU&searchLibraryArr=MR&searchLibraryArr=MJ&searchLibraryArr=CK&searchLibraryArr=MT&searchLibraryArr=MP&searchLibraryArr=MC&searchLibraryArr=PK&searchLibraryArr=MH`, direct: true };
        if (host === "lib.yongin.go.kr") return { url: `https://lib.yongin.go.kr/intro/menu/10004/program/30002/plusSearchResultList.do?searchType=SIMPLE&searchCategory=BOOK&searchKey=TITLE&searchKeyword=${q}&searchTotalPbLibrary=ALL&searchPbLibrary=ALL&searchLibraryArr=MA&searchLibraryArr=MI&searchLibraryArr=MD&searchLibraryArr=MK&searchLibraryArr=MY&searchLibraryArr=MF&searchLibraryArr=NA&searchLibraryArr=ML&searchLibraryArr=MM&searchLibraryArr=NU&searchLibraryArr=MO&searchLibraryArr=MZ&searchLibraryArr=NB&searchLibraryArr=MB&searchLibraryArr=MJ&searchLibraryArr=NN&searchLibraryArr=MX&searchLibraryArr=ME&searchLibraryArr=MP&searchLibraryArr=MC&searchLibraryArr=MN&searchStLibrary=ALL&searchLibraryArr=NO&searchLibraryArr=NJ&searchLibraryArr=NF&searchLibraryArr=NS&searchLibraryArr=NG&searchLibraryArr=NP&searchLibraryArr=NT&searchLibraryArr=NH&searchLibraryArr=NL&searchLibraryArr=NI&searchLibraryArr=NR&searchLibraryArr=NM&searchLibraryArr=ND&searchLibraryArr=NK&searchLibraryArr=NV&searchSmLibrary=ALL&searchLibraryArr=NC&searchLibraryArr=MS&searchLibraryArr=MT&searchLibraryArr=MW&searchLibraryArr=MQ&searchLibraryArr=MV`, direct: true };
        if (host === "www.goyanglib.or.kr") return { url: `https://www.goyanglib.or.kr/${seg || "center"}/program/searchResultList.do?searchType=SIMPLE&searchManageCode=ALL&searchKeyword=${q}`, direct: true };
        if (host === "library.daegu.go.kr") return { url: `https://library.daegu.go.kr/${seg || "jungang"}/intro/search/index.do?title=${q}`, direct: true };
        if (host === "library.busan.go.kr") return { url: `https://library.busan.go.kr/${seg || "busanbooks"}/book/search/collectionOfMaterials?search_field=all&search_keyword=${q}`, direct: true };
        if (host.endsWith(".seocholib.or.kr") || host === "seocholib.or.kr") return { url: `https://${host === "seocholib.or.kr" ? "www.seocholib.or.kr" : host}/KeywordSearchResult/${q}`, direct: true };
        if (host === "www.gdlibrary.or.kr") return { url: `https://www.gdlibrary.or.kr/portal/menu/38/book/search/collection?searchType=normal&tabSearch=false&sortField=score&sortOrder=desc&display=10&searchInput=${q}&manage_code=MH%2CMF%2CMA%2CMB%2CBR%2CMC%2CMD%2CME`, direct: true };
        if (host === "www.eplib.or.kr") return { url: `https://www.eplib.or.kr/intro/program/alpasq/searchResultList.do?searchType=SIMPLE&searchManageCode=ALL&searchKeyword=${q}`, direct: true };
        return { url: normalized, direct: false };
      } catch {
        return { url: normalized, direct: false };
      }
    }

    function renderHistory() {
      const row = document.getElementById("history-row");
      if (!state.history.length) { row.style.display = "none"; return; }
      row.style.display = "flex";
      row.innerHTML = '<span style="color:#a1a1aa;">검색 기록:</span>';
      state.history.forEach((h) => {
        const span = document.createElement("span");
        span.className = "chip";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = h.author ? `${h.title} · ${h.author}` : h.title;
        btn.onclick = () => {
          document.getElementById("title-input").value = h.title;
          document.getElementById("author-input").value = h.author;
          runSearch(h.title, h.author, true);
        };
        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "×";
        del.style.color = "#a1a1aa";
        del.onclick = () => {
          state.history = state.history.filter((x) => x.id !== h.id);
          saveHistory();
          renderHistory();
        };
        span.append(btn, del);
        row.appendChild(span);
      });
      const clearBtn = document.createElement("button");
      clearBtn.type = "button";
      clearBtn.textContent = "전체 삭제";
      clearBtn.style.cssText = "border:0;background:none;color:#71717a;text-decoration:underline;cursor:pointer;font-size:12px;";
      clearBtn.onclick = () => { state.history = []; saveHistory(); renderHistory(); };
      row.appendChild(clearBtn);
    }

    function renderBookAndStores() {
      const b = state.book;
      const card = document.getElementById("book-card");
      const coverEl = b.coverUrl
        ? `<img class="cover-img" src="${b.coverUrl}" alt="${b.title} 표지" onerror="this.style.display='none'" />`
        : `<div class="cover-placeholder">${b.title}</div>`;
      card.innerHTML = `
        <div class="cover-wrap">${coverEl}</div>
        <div class="book-meta">
          <div>
            ${b.isbn13 ? `<span class="isbn-badge">ISBN ${b.isbn13}</span>` : ""}
            <h2 class="book-title">${b.title}</h2>
            <p class="book-sub">${[b.author, b.publisher].filter(Boolean).join(" · ")}</p>
          </div>
          <p style="font-size:13px;color:#52525b;">아래 신간 구매사이트와 중고 도서 사이트에서 현재 가격과 재고를 바로 확인할 수 있어요.</p>
        </div>
      `;

      const q = encodeURIComponent([b.title, b.author].filter(Boolean).join(" "));
      const qTitle = encodeURIComponent(b.isbn13 || b.title);
      const newStores = [
        { name: "교보문고", sub: "도서 상세/검색 바로가기", url: `https://search.kyobobook.co.kr/search?keyword=${q}` },
        { name: "알라딘", sub: "도서 상세/검색 바로가기", url: `https://www.aladin.co.kr/search/wsearchresult.aspx?SearchTarget=Book&SearchWord=${qTitle}` },
        { name: "예스24", sub: "도서 상세/검색 바로가기", url: `https://www.yes24.com/Product/Search?domain=BOOK&query=${qTitle}` },
        { name: "영풍문고", sub: "도서 상세/검색 바로가기", url: `https://www.ypbooks.co.kr/search/book?word=${qTitle}` },
      ];
      document.getElementById("new-stores").innerHTML = newStores.map(s => `
        <a class="item-link" href="${s.url}" target="_blank" rel="noreferrer">
          <div><div class="item-title">${s.name}</div><div class="item-sub">${s.sub}</div></div>
          <span class="price-sale" style="font-size:14px;">이동 →</span>
        </a>
      `).join("");

      const usedStores = [
        { channel: "알라딘", name: "알라딘 중고 (직접배송·우주점·판매자)", sub: "등급별 중고 매물 확인", url: `https://www.aladin.co.kr/search/wsearchresult.aspx?SearchTarget=Used&SearchWord=${qTitle}` },
        { channel: "예스24", name: "예스24 중고샵", sub: "직배송 · 판매자 매물 확인", url: `https://www.yes24.com/Product/Search?domain=USED_GOODS&query=${qTitle}` },
      ];
      document.getElementById("used-stores").innerHTML = usedStores.map(s => `
        <a class="item-link" href="${s.url}" target="_blank" rel="noreferrer">
          <div><div class="channel-label">${s.channel}</div><div class="item-title">${s.name}</div><div class="item-sub">${s.sub}</div></div>
          <span class="price-sale" style="font-size:14px;">매물 보기 →</span>
        </a>
      `).join("");
    }

    function renderRegions() {
      const sidoSel = document.getElementById("sido-select");
      sidoSel.innerHTML = KOREA_REGIONS.map(r => `<option value="${r.id}" ${r.id === state.sidoId ? "selected" : ""}>${r.s}</option>`).join("");
      const cur = KOREA_REGIONS.find(r => r.id === state.sidoId) || KOREA_REGIONS[0];
      const units = (cur.u && cur.u.length) ? cur.u.map(u => u.n) : [cur.n];
      if (!units.includes(state.unitName)) state.unitName = units[0];
      const unitSel = document.getElementById("unit-select");
      unitSel.innerHTML = units.map(u => `<option value="${u}" ${u === state.unitName ? "selected" : ""}>${u}</option>`).join("");
    }

    function renderLibraries() {
      const cur = KOREA_REGIONS.find(r => r.id === state.sidoId) || KOREA_REGIONS[0];
      const isDirect = !(cur.u && cur.u.length);
      const f = state.libFilter.trim().toLowerCase();
      const filtered = REAL_LIBRARIES.filter(lib => {
        if (lib.s !== state.sidoId) return false;
        if (!isDirect && lib.u !== state.unitName) return false;
        if (f && !lib.n.toLowerCase().includes(f) && !lib.d.toLowerCase().includes(f) && !lib.a.toLowerCase().includes(f)) return false;
        const res = buildLibraryUrl(lib, state.book.title);
        return res.direct && Boolean(res.url);
      }).slice(0, 60);

      document.getElementById("lib-count").textContent = `${filtered.length}곳`;
      const list = document.getElementById("lib-list");
      if (!filtered.length) {
        list.innerHTML = '<p style="text-align:center;color:#71717a;font-size:13px;padding:24px 0;">조건에 맞는 도서관이 없어요.</p>';
        return;
      }
      list.innerHTML = filtered.map(lib => {
        const res = buildLibraryUrl(lib, state.book.title);
        return `
          <a class="item-link lib-item" href="${res.url || '#'} " target="_blank" rel="noreferrer">
            <div class="item-title">${lib.n}</div>
            <div class="item-sub">${lib.d} · ${lib.a}</div>
            <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:11px;color:#71717a;">${(lib.h || "").slice(0, 26)}</span>
              <span class="tag-pill">${res.direct ? "도서 검색 열기" : "도서관 홈"}</span>
            </div>
          </a>
        `;
      }).join("");
    }

    async function runSearch(t, a, addHistory) {
      const title = (t || "").trim();
      const author = (a || "").trim();
      if (!title && !author) return;
      if (addHistory) {
        const id = (title + "||" + author).toLowerCase();
        state.history = [{ id, title, author }, ...state.history.filter(x => x.id !== id)].slice(0, 10);
        saveHistory();
        renderHistory();
      }
      state.book = { title: title || author, author, publisher: "", isbn13: "", coverUrl: "" };
      try {
        const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent([title, author].filter(Boolean).join(" "))}&limit=3`);
        if (res.ok) {
          const data = await res.json();
          const doc = (data.docs || [])[0];
          if (doc) {
            const isbn13 = (doc.isbn || []).find(x => /^\d{13}$/.test(x)) || "";
            state.book = {
              title: title || doc.title,
              author: author || (doc.author_name || [])[0] || "",
              publisher: (doc.publisher || [])[0] || "",
              isbn13,
              coverUrl: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg` : ""
            };
          }
        }
      } catch {}
      renderBookAndStores();
      renderLibraries();
    }

    document.getElementById("search-form").onsubmit = (e) => {
      e.preventDefault();
      runSearch(document.getElementById("title-input").value, document.getElementById("author-input").value, true);
    };
    document.getElementById("sido-select").onchange = (e) => { state.sidoId = e.target.value; renderRegions(); renderLibraries(); };
    document.getElementById("unit-select").onchange = (e) => { state.unitName = e.target.value; renderLibraries(); };
    document.getElementById("lib-filter").oninput = (e) => { state.libFilter = e.target.value; renderLibraries(); };

    renderRegions();
    renderHistory();
    renderBookAndStores();
    renderLibraries();
  </script>
</body>
</html>
